name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    # Nilai dummy agar build jalan tanpa secret asli; DB SQLite kosong hasil migrate untuk generateStaticParams dan test.
    env:
      DATABASE_URL: file:/tmp/sakkarepe-ci.db
      AUTH_SECRET: ci-dummy-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
